# 待单独审阅安装：合入现有博客 HTTPS server 块。不要替换或修改 fefw 站点。
# 新版发布目录包含 site/（静态网站）和 server/（不公开的后台源码）。
root /var/www/hanser.fireemblem.top/current/site;

location = /admin {
    return 302 /admin/;
}

location ~ ^/(admin/|admin-assets/|api/) {
    proxy_pass http://127.0.0.1:4322;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 8k;
    proxy_read_timeout 15s;
}
